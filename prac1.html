<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mines</title>

    <link href="./prac1.css" rel="stylesheet" type="text/css">
    <script type="text/javascript" src="./prac1.js" defer></script>


</head>
<body>
    <h1 id="titulo">MINES</h1>

    <div id="zonaPrincipal">


        <!--Rectangulo lateral-->
        <div id="panelLateral">
            <!--Modificador del tamaño-->
            <div id="controlTam">

                <div id="tituloTam">
                    <span>Tamaño de tabla</span>
                    <div id="valorTam">3x3</div>
                </div>

                <div id="selectorTam">
                    <span class="extremo">3</span>

                    <div id="lineaContTam">
                        <div id="puntoContTam"></div>
                    </div>

                    <span class="extremo">9</span>
                </div>
            </div>

            <div id="controlNumMinas">
                <div id="tituloMinas">
                    <span>Numero de Minas</span>
                </div>
                <input type="number" id="numMinas" min=1 step="1">
            </div>

            <div id="apuesta">
                <button id="apostar">APOSTAR</button>
                <span id="tituloApuesta">Apuesta</span>
                <input type="number" id="cantApuesta" min=0.01 step="0.01">
            </div>

        </div>

        <!--Tablero-->
        <div id="tablero"></div>

        <!--Columna multiplicadores-->
        <div id="multiplicadores"></div>
    </div>
    
</body>
</html>
